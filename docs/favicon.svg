<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A35" />
      <stop offset="60%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#D93800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Stylized Flame / Emblem contour -->
  <path d="M 50,8 C 76,8 92,26 92,52 C 92,76 74,92 50,92 C 26,92 8,76 8,52 C 8,30 24,14 44,9 L 50,2 Z" fill="none" stroke="url(#leafGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Inner Konoha Spiral -->
  <path d="M 50,30 C 58,30 64,36 64,44 C 64,54 55,62 45,62 C 32,62 24,51 24,38 C 24,22 38,18 56,18 C 76,18 84,33 84,54 C 84,74 68,84 48,84 C 30,84 16,72 16,52" fill="none" stroke="url(#leafGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Leaf Stem Pointer -->
  <path d="M 50,2 L 54,12 L 46,12 Z" fill="url(#leafGrad)"/>
</svg>